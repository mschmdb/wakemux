name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # wakemux targets macOS; its script runs on the bash 3.2 that macOS ships.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - name: Install bats and shellcheck
        run: brew install bats-core shellcheck
      - name: shellcheck
        run: shellcheck bin/wakemux install.sh
      - name: Script tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          git config --global init.defaultBranch main
          bats tests
      # The Claude Code version wakemux is developed with. Plugin tests and validation need no login.
      - name: Mod tests
        run: pnpm dlx @anthropic-ai/claude-code@2.1.319 plugin test .
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
      - name: Validate the plugin
        run: pnpm dlx @anthropic-ai/claude-code@2.1.319 plugin validate .
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
